# ==============================================================================
# FortiOS 7.6.8 - Configuración Sanitizada: Control de Aplicaciones (Firmas Base)
# Paquete de firmas embebido de fábrica: Application Definitions v6.00741 signed
# ==============================================================================

# 1. Verificación previa de firmas embebidas en CLI (comando de diagnóstico):
#    diagnose autoupdate versions | grep -A 5 "Application Definitions"

# 2. Perfil de Application Control (Categorías + Application Overrides)
config application list
    edit "AppCtrl_Laboratorio"
        set comment "Bloqueo L7 de P2P, Proxy, Remote Access, Mensajería y Evasión SSH-443"
        set other-application-action pass
        set other-application-log enable
        set unknown-application-action pass
        config entries
            # Priority 1: Mensajería instantánea (Telegram y variantes de WhatsApp)
            edit 1
                set application 39999 28057 42471 42472 34051
                # Referencia GUI: Telegram, Whatsapp, WhatsApp_VoIP.Call, Whatsapp_Web, WhatsApp.File_Transfer
                set action block
                set log enable
            next
            # Priority 2: Evasión de puertos (SSH) y Escritorio Remoto (AnyDesk / TeamViewer)
            edit 2
                set application 16060 40179 16180 41720 41721
                # Referencia GUI: SSH, AnyDesk, Teamviewer, Teamviewer_CallReceive, Teamviewer_CallRequest
                set action block
                set log enable
            next
            # Priority 3: Clientes P2P (BitTorrent y variantes)
            edit 3
                set application 15817 41009 36172
                # Referencia GUI: BitTorrent, BitTorrent.Bleep, BitTorrent.Sync
                set action block
                set log enable
            next
            # Categorías bloqueadas: P2P (2), Proxy (6), Remote.Access (7)
            edit 4
                set category 2 6 7
                set action block
                set log enable
            next
            # Resto de categorías en modo Monitor para visibilidad completa en logs
            edit 5
                set action pass
                set log enable
            next
        end
    next
end

# 3. Política de Firewall (Estado Final Endurecido con Application Control L7)
#    Nota: Durante la prueba P2P e instalación de aria2 se habilitó temporalmente
#    service "ALL" y se desvinculó webfilter-profile (*kali*), restaurándose al finalizar.
config firewall policy
    edit 1
        set name "Laboratorio"
        set srcintf "port2"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "DNS" "HTTP" "HTTPS"
        set utm-status enable
        set ssl-ssh-profile "certificate-inspection"
        set webfilter-profile "Laboratorio"
        set application-list "AppCtrl_Laboratorio"
        set logtraffic all
        set nat enable
    next
end
