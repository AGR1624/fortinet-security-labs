# ==============================================================================
# FortiOS 7.6.8 - Configuración Sanitizada: Inspección Profunda SSL/TLS (DPI)
# ==============================================================================

# 1. Importación de Autoridad Certificadora (CA) propia de 2048 bits (PKCS#1)
#    Nombre del objeto: FortiDPI_2048 | Subject: CN = FortiGate_DPI_2048
config vpn certificate local
    edit "FortiDPI_2048"
        set private-key "-----BEGIN RSA PRIVATE KEY-----
<REDACTED_PRIVATE_KEY>
-----END RSA PRIVATE KEY-----"
        set certificate "-----BEGIN CERTIFICATE-----
<REDACTED_CERTIFICATE>
-----END CERTIFICATE-----"
    next
end

# 2. Perfil de Inspección Profunda SSL/TLS
config firewall ssl-ssh-profile
    edit "custom-deep-inspection"
        set caname "FortiDPI_2048"
    next
end

# 3. Tabla de Filtro URL Estático (Rutas granulares, extensiones y palabras clave)
config webfilter urlfilter
    edit 1
        set name "Auto-webfilter-urlfilter_1"
        config entries
            edit 1
                set url "es.wikipedia.org/wiki/Linux"
                set type simple
                set action block
            next
            edit 2
                set url "github.com/torvalds/linux"
                set type simple
                set action block
            next
            edit 3
                set url "*.pdf"
                set type wildcard
                set action block
            next
            edit 4
                set url "*kali*"
                set type wildcard
                set action block
            next
        end
    next
end

# 4. Perfil de Filtrado Web Estático (Sin dependencia de FortiGuard Cloud)
config webfilter profile
    edit "Laboratorio"
        config web
            set urlfilter-table 1
        end
        config ftgd-wf
            unset options
        end
    next
end

# 5. Política de Firewall con DPI, servicios acotados y registro completo
config firewall policy
    edit 1
        set name "Laboratorio"
        set srcintf "port2"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "DNS" "HTTP" "HTTPS"
        set utm-status enable
        set ssl-ssh-profile "custom-deep-inspection"
        set webfilter-profile "Laboratorio"
        set logtraffic all
        set nat enable
    next
end