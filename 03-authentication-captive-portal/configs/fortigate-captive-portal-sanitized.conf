# ==============================================================================
# FortiOS 7.6.8 - Configuración Sanitizada: Autenticación, Portal Cautivo y
# Políticas Basadas en Identidad (Grupo)
# ==============================================================================

# 1. Definición de Usuarios Locales (Credenciales redactadas por OpSec)
config user local
    edit "usuario_ti"
        set type password
        set passwd <REDACTED_PASSWORD_TI>
    next
    edit "usuario_invitado"
        set type password
        set passwd <REDACTED_PASSWORD_INVITADO>
    next
end

# 2. Definición de Grupos de Firewall por Perfil de Acceso
config user group
    edit "Grupo_TI"
        set member "usuario_ti"
    next
    edit "Grupo_Invitados"
        set member "usuario_invitado"
    next
end

# 3. Habilitación del Portal Cautivo Local en la Interfaz LAN (port2)
config system interface
    edit "port2"
        set ip 192.168.10.1 255.255.255.0
        set security-mode captive-portal
        set security-groups "Grupo_TI" "Grupo_Invitados"
    next
end

# 4. Mitigación de Evasión HTTP/3 (QUIC sobre UDP/443) en AppCtrl_Laboratorio
#    Fuerza a los navegadores modernos a degradar a TLS sobre TCP/443 para inspección
config application list
    edit "AppCtrl_Laboratorio"
        config entries
            edit 0
                set application 39224
                set action block
            next
        end
    next
end

# 5. Políticas de Firewall Basadas en Identidad (Deshabilitando política genérica ID 1)
config firewall policy
    edit 1
        set name "Laboratorio"
        set status disable
    next
    edit 3
        set name "Politica_Grupo_TI"
        set srcintf "port2"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set groups "Grupo_TI"
        set logtraffic all
        set nat enable
    next
    edit 4
        set name "Politica_Grupo_Invitados"
        set srcintf "port2"
        set dstintf "port1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set schedule "always"
        set service "DNS" "HTTP" "HTTPS"
        set groups "Grupo_Invitados"
        set utm-status enable
        set ssl-ssh-profile "custom-deep-inspection"
        set webfilter-profile "Laboratorio"
        set application-list "AppCtrl_Laboratorio"
        set logtraffic all
        set nat enable
    next
end
